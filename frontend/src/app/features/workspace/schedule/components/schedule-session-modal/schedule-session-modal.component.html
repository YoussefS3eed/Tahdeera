<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <div>
        <h3 id="modal-title" class="modal-title">جدولة جلسة دراسية جديدة (SCR-11)</h3>
        <p class="modal-subtitle">تحديد الموعد والقاعة وفترة سماح التأخير</p>
      </div>
      <button type="button" class="btn-close" (click)="close()" aria-label="إغلاق">✕</button>
    </div>

    @if (validationError()) {
      <div class="alert-error" role="alert">
        {{ validationError() }}
      </div>
    }

    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="sess-group">
          المجموعة الدراسية: <span class="required">*</span>
        </label>
        <select id="sess-group" class="form-select" [(ngModel)]="selectedGroupId">
          <option value="">اختر المجموعة الدراسية...</option>
          @for (grp of groups(); track grp.id) {
            <option [value]="grp.id">{{ grp.name }} ({{ grp.grade }})</option>
          }
        </select>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="sess-date">تاريخ الجلسة: <span class="required">*</span></label>
          <input id="sess-date" type="date" class="form-input font-mono ltr-num" [(ngModel)]="sessionDate" />
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="sess-room">القاعة الدراسية: <span class="required">*</span></label>
          <input id="sess-room" type="text" class="form-input" [(ngModel)]="roomName" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="sess-start">وقت البدء: <span class="required">*</span></label>
          <input id="sess-start" type="time" class="form-input font-mono ltr-num" [(ngModel)]="startTime" />
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="sess-end">وقت الانتهاء: <span class="required">*</span></label>
          <input id="sess-end" type="time" class="form-input font-mono ltr-num" [(ngModel)]="endTime" />
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="sess-grace">سماح التأخير (دقيقة):</label>
          <input id="sess-grace" type="number" class="form-input font-mono ltr-num" [(ngModel)]="lateGraceMinutes" />
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="close()">إلغاء</button>
      <button type="button" class="btn btn-primary" [disabled]="!isValid" (click)="submit()">
        حفظ وجدولة الجلسة 📅
      </button>
    </div>
  </div>
</div>
